name: Minimal kernel

on:
  pull_request:
  push:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minimal-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOPROXY: https://proxy.golang.org,direct
      VIVY_GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - name: Verify checksum-pinned TUI module source
        run: go mod download -json github.com/charmbracelet/glamour@v1.0.0
      - name: Verify portable bootstrap and generated wiring
        run: just wiring-ci
      - name: Verify kernel owners and the real minimal artifact
        run: just kernel-ci
      - name: Verify affected D02 protocol and Faces
        run: just d02-ci
