name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend ci
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Test plugin v1 fixture validator
        run: node --test scripts/check-plugin-v1-fixtures.test.mjs

      - name: Validate plugin v1 fixture corpus
        run: node scripts/check-plugin-v1-fixtures.mjs

      - name: Verify fresh-clone setup
        # setup now uses a process-local GOPROXY and never writes go env, so
        # there is no global proxy state to restore.
        run: just setup

      - name: Verify independent fresh-clone dev startup
        shell: pwsh
        run: |
          # The dev entry must prepare Laputa without inheriting setup's checkout.
          Move-Item ../laputa ../laputa-setup-checked
          if (Test-Path ui/dist) { throw 'cold dev smoke must start without ui/dist' }
          New-Item -ItemType Directory -Force .workspace | Out-Null
          $dev = Start-Process just -ArgumentList @('dev', '-NoBrowser') -PassThru `
            -RedirectStandardOutput .workspace/cold-dev.stdout.log `
            -RedirectStandardError .workspace/cold-dev.stderr.log
          try {
            $ready = $false
            $deadline = (Get-Date).AddMinutes(8)
            while ((Get-Date) -lt $deadline) {
              if ($dev.HasExited) { throw "just dev exited with $($dev.ExitCode)" }
              try {
                $backend = Invoke-WebRequest http://127.0.0.1:8788/healthz -TimeoutSec 2
                $ui = Invoke-WebRequest http://127.0.0.1:3016/ -TimeoutSec 2
                if ($backend.StatusCode -eq 200 -and $ui.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'fresh-clone just dev did not become ready' }
          } finally {
            Get-Content .workspace/cold-dev.stdout.log -ErrorAction SilentlyContinue
            Get-Content .workspace/cold-dev.stderr.log -ErrorAction SilentlyContinue
            if (-not $dev.HasExited) {
              # taskkill exits 1 when a tree member already exited on its own;
              # that teardown noise must not fail a green smoke.
              taskkill.exe /T /F /PID $dev.Id
              $global:LASTEXITCODE = 0
            }
          }

      - name: Run backend CI
        env:
          # Keep owned disk-backed test fixtures in the runner's temporary volume.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: just backend-ci

  native:
    name: native Windows memory owners
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare pinned Laputa sources through the developer bootstrap
        run: ./scripts/ensure-laputa.ps1

      - name: Execute native BML and ACTMEM Garden suites
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'test-evidence/native'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $go = (Get-Command go).Source
          $lock = Get-Content laputa-source.lock.json -Raw | ConvertFrom-Json
          $nativeHead = (& git -C ../laputa rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $nativeHead -ne $lock.commit) { throw 'native checkout does not match the published source lock' }
          $identity = [ordered]@{
            vivy_commit = (& git rev-parse HEAD).Trim()
            laputa_lock = $lock
            laputa_head = $nativeHead
            go_version = (& $go version) -join "`n"
            go_os = (& $go env GOOS).Trim()
            go_arch = (& $go env GOARCH).Trim()
            runner_os = $env:RUNNER_OS
            host_os = [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
            run_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            qualification = 'Native Windows tests; no PostgreSQL DSN or live-provider acceptance claim'
          }
          $identity | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $evidence 'identity.json') -Encoding utf8
          if ($identity.go_os -ne 'windows') { throw 'native Windows lane must execute on Windows, not cross-compile' }
          $lanes = @(
            @{ name = 'bml'; root = 'bml'; packages = @('./...') },
            @{ name = 'actmem'; root = '../laputa/laputa'; packages = @('./actmem') },
            @{ name = 'garden'; root = '../laputa/garden'; packages = @('./internal/ingest', './internal/runtimecore', './agentapi') }
          )
          $results = @()
          $failed = $false
          foreach ($lane in $lanes) {
            Push-Location $lane.root
            try {
              & $go mod edit -json 1> (Join-Path $evidence "$($lane.name)-declared-module.json") 2> (Join-Path $evidence "$($lane.name)-module.stderr.log")
              if ($LASTEXITCODE -ne 0) { throw "cannot record declared module for $($lane.name)" }
              $arguments = @('test', '-json', '-p=1', '-count=1', '-timeout=5m') + $lane.packages
              @{ lane = $lane.name; module_root = $lane.root; command = @($go) + $arguments } | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $evidence "$($lane.name)-command.json") -Encoding utf8
              Write-Host "Native $($lane.name): $go $($arguments -join ' ')"
              $started = Get-Date
              & $go @arguments 1> (Join-Path $evidence "$($lane.name).jsonl") 2> (Join-Path $evidence "$($lane.name).stderr.log")
              $code = $LASTEXITCODE
              $counts = [ordered]@{ tests_passed = 0; tests_failed = 0; tests_skipped = 0; packages_passed = 0; packages_failed = 0; packages_skipped = 0 }
              foreach ($line in Get-Content (Join-Path $evidence "$($lane.name).jsonl")) {
                if ([string]::IsNullOrWhiteSpace($line)) { continue }
                $event = $line | ConvertFrom-Json
                $kind = if ($event.Test) { 'tests' } else { 'packages' }
                switch ($event.Action) {
                  'pass' { $counts["${kind}_passed"]++ }
                  'fail' { $counts["${kind}_failed"]++ }
                  'skip' { $counts["${kind}_skipped"]++ }
                }
              }
              $results += [ordered]@{ lane = $lane.name; module_root = $lane.root; command = @($go) + $arguments; exit_code = $code; elapsed_seconds = ((Get-Date) - $started).TotalSeconds; counts = $counts }
              $results | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $evidence 'results.json') -Encoding utf8
              Write-Host "$($lane.name): exit=$code $($counts | ConvertTo-Json -Compress)"
              if ($code -ne 0 -or $counts.tests_failed -gt 0 -or $counts.packages_failed -gt 0) { $failed = $true }
            } finally {
              Pop-Location
            }
          }
          if ($failed) { throw 'a required native memory-owner suite failed; see preserved test-evidence/native' }

      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-memory-test-evidence
          path: test-evidence/native/
          if-no-files-found: warn

  ui:
    name: ui ci
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Prepare pinned Laputa sources
        run: node scripts/ensure-laputa.mjs --quiet

      # The UI builds the projection the SDK's Assembler writes from
      # recipes/default.vivy.yml (ui/package.json pre-hooks call
      # `go run ./sdk stage-ui`), so this lane needs the pinned toolchain too.
      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Run UI CI
        run: just ui-ci

  browser:
    name: full UI browser smoke
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Prepare pinned Laputa sources
        run: node scripts/ensure-laputa.mjs --quiet

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Build baseline UI embed
        working-directory: ui
        run: pnpm build

      - name: Install Chromium
        working-directory: ui
        run: pnpm exec playwright install chromium

      - name: Pack and start selected full UI
        shell: pwsh
        env:
          VIVY_FULL_UI_URL: http://127.0.0.1:3015
        run: |
          New-Item -ItemType Directory -Force -Path .workspace/p9-browser-home | Out-Null
          go run ./sdk pack --recipe sdk/internal/testdata/full-ui.vivy.yml --source sdk/internal/testdata/full-ui-module --output .workspace/p9-full-ui
          $savedAddr = $env:VIVY_ADDR
          $savedHome = $env:VIVY_USER_HOME
          try {
            $env:VIVY_ADDR = '127.0.0.1:3015'
            $env:VIVY_USER_HOME = (Resolve-Path '.workspace/p9-browser-home').Path
            $process = Start-Process -FilePath (Resolve-Path '.workspace/p9-full-ui/vivy.exe') -WorkingDirectory $PWD -PassThru -RedirectStandardOutput '.workspace/p9-full-ui.stdout.log' -RedirectStandardError '.workspace/p9-full-ui.stderr.log'
            Set-Content -Path '.workspace/p9-full-ui.pid' -Value $process.Id
          } finally {
            $env:VIVY_ADDR = $savedAddr
            $env:VIVY_USER_HOME = $savedHome
          }
          $healthy = $false
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 'http://127.0.0.1:3015/healthz'
              if ($response.StatusCode -eq 200) {
                $healthy = $true
                break
              }
            } catch {
              Start-Sleep -Milliseconds 500
            }
          }
          if (-not $healthy) {
            Get-Content '.workspace/p9-full-ui.stdout.log' -ErrorAction SilentlyContinue
            Get-Content '.workspace/p9-full-ui.stderr.log' -ErrorAction SilentlyContinue
            throw 'selected full-UI server did not become healthy'
          }
          $env:GO_EXE = (Get-Command go).Source
          Push-Location ui
          try {
            pnpm exec playwright test e2e/plugin-full-ui.spec.ts
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          } finally {
            Pop-Location
          }

      - name: Dump selected full UI logs on failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path '.workspace/p9-full-ui.stdout.log') {
            Write-Host '--- selected full UI stdout ---'
            Get-Content '.workspace/p9-full-ui.stdout.log'
          }
          if (Test-Path '.workspace/p9-full-ui.stderr.log') {
            Write-Host '--- selected full UI stderr ---'
            Get-Content '.workspace/p9-full-ui.stderr.log'
          }

      - name: Stop selected full UI
        if: always()
        shell: pwsh
        run: |
          if (Test-Path '.workspace/p9-full-ui.pid') {
            Stop-Process -Id (Get-Content '.workspace/p9-full-ui.pid') -Force -ErrorAction SilentlyContinue
          }

      - name: Run actual Recap split browser test
        shell: pwsh
        run: |
          $env:GO_EXE = (Get-Command go).Source
          pnpm --dir ui exec playwright test --config playwright.issue58.config.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results
          path: ui/test-results/
          if-no-files-found: warn

  linux-backend:
    name: linux backend ci
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      # The stable Linux main development line. Windows stays the platform
      # acceptance line; this lane catches Linux-only build and test breaks.
      - name: Run backend CI
        run: just backend-ci

  linux-race:
    name: linux race
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      # Eino v0.9.21 fixes EINO-TOOLSNODE-ERR-RACE. EinoExt Claude v0.1.25
      # still has EINOEXT-CLAUDE-STREAM-RACE. Run the full gate and report it;
      # do not skip the affected tests to manufacture a green lane.
      - name: Run kernel race tests
        run: just race-ci

  postgres:
    name: postgres integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vivy
          POSTGRES_PASSWORD: vivy
          POSTGRES_DB: vivy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vivy -d vivy"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      VIVY_POSTGRES_TEST_DSN: postgres://vivy:vivy@127.0.0.1:5432/vivy?sslmode=disable

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      # The helper exits non-zero when the DSN is empty, so a skipped run can
      # never be reported as a passing Postgres gate.
      - name: Run PostgreSQL integration tests
        run: just test-postgres

  aggregate:
    name: just ci
    if: always()
    needs:
      - backend
      - browser
      - native
      - ui
      - linux-backend
      - linux-race
      - postgres
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every CI lane
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          UI_RESULT: ${{ needs.ui.result }}
          LINUX_BACKEND_RESULT: ${{ needs.linux-backend.result }}
          LINUX_RACE_RESULT: ${{ needs.linux-race.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
        run: |
          echo "backend ci: $BACKEND_RESULT"
          echo "browser smoke: $BROWSER_RESULT"
          echo "native Windows memory owners: $NATIVE_RESULT"
          echo "ui ci: $UI_RESULT"
          echo "linux backend ci: $LINUX_BACKEND_RESULT"
          echo "linux race: $LINUX_RACE_RESULT"
          echo "postgres integration: $POSTGRES_RESULT"
          test "$BACKEND_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
          test "$NATIVE_RESULT" = "success"
          test "$UI_RESULT" = "success"
          test "$LINUX_BACKEND_RESULT" = "success"
          test "$LINUX_RACE_RESULT" = "success"
          test "$POSTGRES_RESULT" = "success"
