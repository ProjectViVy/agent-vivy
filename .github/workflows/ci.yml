name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main
      - stable
  workflow_dispatch:
    inputs:
      base:
        description: Comparison baseline ref or SHA
        required: true
        type: string
      scopes:
        description: Additional scope IDs separated by spaces
        type: string
      full:
        description: Run full product CI after scoped checks
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.select.outputs.full }}
      ui: ${{ steps.select.outputs.ui }}
      go: ${{ steps.select.outputs.go }}
      postgres: ${{ steps.select.outputs.postgres }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - id: select
        name: Select affected checks and final Epic mode
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base }}
          CI_SCOPES: ${{ inputs.scopes }}
        run: node scripts/ci-small.mjs --base "$CI_BASE" --plan --actions

  small:
    name: small ci
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: ${{ needs.plan.outputs.postgres == 'true' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: vivy
          POSTGRES_PASSWORD: ci-disposable
          POSTGRES_DB: vivy_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - if: needs.plan.outputs.go == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - if: needs.plan.outputs.ui == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - if: needs.plan.outputs.ui == 'true'
        run: pnpm --dir ui install --frozen-lockfile
      - if: needs.plan.outputs.ui == 'true'
        working-directory: ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Run exactly the selected small CI
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base }}
          CI_SCOPES: ${{ inputs.scopes }}
          VIVY_POSTGRES_TEST_DSN: ${{ needs.plan.outputs.postgres == 'true' && 'postgres://vivy:ci-disposable@127.0.0.1:5432/vivy_test?sslmode=disable' || '' }}
        run: node scripts/ci-small.mjs --base "$CI_BASE"

  backend:
    needs: [plan, small]
    if: needs.plan.outputs.full == 'true'
    name: backend ci
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Test plugin v1 fixture validator
        run: node --test scripts/check-plugin-v1-fixtures.test.mjs

      - name: Validate plugin v1 fixture corpus
        run: node scripts/check-plugin-v1-fixtures.mjs

      - name: Verify fresh-clone setup
        run: just setup

      - name: Verify independent fresh-clone dev startup
        shell: pwsh
        run: |
          # The dev entry must prepare Laputa without inheriting setup's checkout.
          Move-Item ../laputa ../laputa-setup-checked
          if (Test-Path ui/dist) { throw 'cold dev smoke must start without ui/dist' }
          New-Item -ItemType Directory -Force .workspace | Out-Null
          $dev = Start-Process just -ArgumentList @('dev', '-NoBrowser') -PassThru `
            -RedirectStandardOutput .workspace/cold-dev.stdout.log `
            -RedirectStandardError .workspace/cold-dev.stderr.log
          try {
            $ready = $false
            $deadline = (Get-Date).AddMinutes(8)
            while ((Get-Date) -lt $deadline) {
              if ($dev.HasExited) { throw "just dev exited with $($dev.ExitCode)" }
              try {
                $backend = Invoke-WebRequest http://127.0.0.1:8787/healthz -TimeoutSec 2
                $ui = Invoke-WebRequest http://127.0.0.1:3015/ -TimeoutSec 2
                if ($backend.StatusCode -eq 200 -and $ui.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'fresh-clone just dev did not become ready' }
          } finally {
            Get-Content .workspace/cold-dev.stdout.log -ErrorAction SilentlyContinue
            Get-Content .workspace/cold-dev.stderr.log -ErrorAction SilentlyContinue
            if (-not $dev.HasExited) { taskkill.exe /T /F /PID $dev.Id }
          }

      - name: Run backend CI
        run: just backend-ci

  ui:
    needs: [plan, small]
    if: needs.plan.outputs.full == 'true'
    name: ui ci
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Prepare pinned Laputa sources through the developer bootstrap
        run: ./scripts/ensure-laputa.ps1

      # The UI builds the projection the SDK's Assembler writes from
      # recipes/default.vivy.yml (ui/package.json pre-hooks call
      # `go run ./sdk stage-ui`), so this lane needs the pinned toolchain too.
      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Run UI CI
        run: just ui-ci

  browser:
    needs: [plan, small]
    if: needs.plan.outputs.full == 'true'
    name: full UI browser smoke
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare pinned Laputa sources through the developer bootstrap
        run: ./scripts/ensure-laputa.ps1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Build baseline UI embed
        working-directory: ui
        run: pnpm build

      - name: Install Chromium
        working-directory: ui
        run: pnpm exec playwright install chromium

      - name: Pack and start selected full UI
        shell: pwsh
        env:
          VIVY_FULL_UI_URL: http://127.0.0.1:3015
        run: |
          New-Item -ItemType Directory -Force -Path .workspace/p9-browser-home | Out-Null
          go run ./sdk pack --recipe sdk/internal/testdata/full-ui.vivy.yml --source sdk/internal/testdata/full-ui-module --output .workspace/p9-full-ui
          $savedAddr = $env:VIVY_ADDR
          $savedHome = $env:VIVY_USER_HOME
          try {
            $env:VIVY_ADDR = '127.0.0.1:3015'
            $env:VIVY_USER_HOME = (Resolve-Path '.workspace/p9-browser-home').Path
            $process = Start-Process -FilePath (Resolve-Path '.workspace/p9-full-ui/vivy.exe') -WorkingDirectory $PWD -PassThru -RedirectStandardOutput '.workspace/p9-full-ui.stdout.log' -RedirectStandardError '.workspace/p9-full-ui.stderr.log'
            Set-Content -Path '.workspace/p9-full-ui.pid' -Value $process.Id
          } finally {
            $env:VIVY_ADDR = $savedAddr
            $env:VIVY_USER_HOME = $savedHome
          }
          $healthy = $false
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 'http://127.0.0.1:3015/healthz'
              if ($response.StatusCode -eq 200) {
                $healthy = $true
                break
              }
            } catch {
              Start-Sleep -Milliseconds 500
            }
          }
          if (-not $healthy) {
            Get-Content '.workspace/p9-full-ui.stdout.log' -ErrorAction SilentlyContinue
            Get-Content '.workspace/p9-full-ui.stderr.log' -ErrorAction SilentlyContinue
            throw 'selected full-UI server did not become healthy'
          }
          $env:GO_EXE = (Get-Command go).Source
          Push-Location ui
          try {
            pnpm exec playwright test e2e/plugin-full-ui.spec.ts
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          } finally {
            Pop-Location
          }

      - name: Dump selected full UI logs on failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path '.workspace/p9-full-ui.stdout.log') {
            Write-Host '--- selected full UI stdout ---'
            Get-Content '.workspace/p9-full-ui.stdout.log'
          }
          if (Test-Path '.workspace/p9-full-ui.stderr.log') {
            Write-Host '--- selected full UI stderr ---'
            Get-Content '.workspace/p9-full-ui.stderr.log'
          }

      - name: Stop selected full UI
        if: always()
        shell: pwsh
        run: |
          if (Test-Path '.workspace/p9-full-ui.pid') {
            Stop-Process -Id (Get-Content '.workspace/p9-full-ui.pid') -Force -ErrorAction SilentlyContinue
          }

  aggregate:
    name: just ci
    if: always()
    needs: [plan, small, backend, browser, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Require selected lanes and report full CI separately
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          FULL: ${{ needs.plan.outputs.full }}
          SMALL_RESULT: ${{ needs.small.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          UI_RESULT: ${{ needs.ui.result }}
        run: node scripts/ci-small.mjs --aggregate
