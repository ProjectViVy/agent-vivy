# Vivy provider data — the single source of truth for providers.
# Edited by hand or by data review; embedded at build time and validated at
# startup. See README.md and provider.schema.json in this directory.
# Derived once from the Diva catalog on 2026-09-18 (provenance per vendor).
# Secrets never live here: env_key names the environment variable only (D-010).

- name: deepseek
  display_name: DeepSeek
  env_key: DEEPSEEK_API_KEY
  endpoints:
    - adapter: openai-completions
      base_url: https://api.deepseek.com
      default_model: deepseek-flash
      models:
        - id: deepseek-flash
          context_window: 1000000
          input_per_mtok: 0.3
          output_per_mtok: 1.2
          supports_images: true
          supports_thinking: true
        - id: deepseek-v4-pro
          context_window: 1000000
          input_per_mtok: 1.32
          output_per_mtok: 3.96
          supports_thinking: true
        - id: deepseek-v4-flash
          context_window: 1000000
          input_per_mtok: 0.3
          output_per_mtok: 1.2
          supports_images: true
          supports_thinking: true
        - id: deepseek-chat
        - id: deepseek-coder
        - id: deepseek-reasoner
          supports_thinking: true
      capabilities:
        - deepseek-thinking
    - adapter: anthropic-messages
      base_url: https://api.deepseek.com/anthropic
      default_model: deepseek-chat
      models:
        - id: deepseek-chat
      supports_prompt_caching: true
  provenance:
    source: agent-diva/agent-diva-providers/src/providers.yaml
    entry: deepseek
    derived_at: "2026-09-18"
    note: Re-derived into the Vivy schema; dropped fields and rules are in README.md; Vivy-normalized default (deepseek-flash at https://api.deepseek.com) and DeepSeek's Anthropic-compatible endpoint declared.
- name: sensenova
  display_name: SenseNova
  env_key: SENSENOVA_API_KEY
  endpoints:
    - adapter: openai-completions
      base_url: https://token.sensenova.cn/v1
      default_model: sensenova-6.8-flash-lite
      models:
        - id: sensenova-6.8-flash-lite
          context_window: 262144
          supports_images: true
          supports_thinking: true
        - id: sensenova-u1-fast
          context_window: 262144
          supports_thinking: true
        - id: sensenova-u1.5-lite
          context_window: 262144
          supports_thinking: true
        - id: deepseek-v4-flash
          context_window: 1048576
          supports_thinking: true
        - id: deepseek-v4-pro
          context_window: 1048576
          supports_thinking: true
        - id: glm-5.2
          context_window: 1048576
          supports_thinking: true
        - id: kimi-k3
          context_window: 1048576
          supports_thinking: true
  provenance:
    source: https://token.sensenova.cn/v1/models
    entry: sensenova
    derived_at: "2026-09-27"
    note: Not in the upstream catalog; authored from the live /v1/models response. u1-fast/u1.5-lite emit images; all listed models report tools + reasoning support. Prices report 0 on the free token plan, left unpriced.
