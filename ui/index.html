<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Agent Diva 前端演示</title>
    <style>
      /* 内联样式确保主题底色立即生效，避免闪烁；色值是各主题 --background 的近似值 */
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100dvh;
        max-height: 100dvh;
        overflow: hidden;
      }
      html, html body {
        background-color: #f6f7f9;
        color: #1c2030;
      }
      html[data-theme="pink"], html[data-theme="pink"] body {
        background-color: #ffffff;
        color: #6b2737;
      }
      html[data-theme="dark"], html[data-theme="dark"] body,
      html[data-theme="miku"], html[data-theme="miku"] body {
        background-color: #10131f;
        color: #e6edf3;
      }
    </style>
    <script>
      // 在 React 加载前应用持久化主题（vivy.theme），避免闪烁。
      // 必须与 src/hooks/use-theme.ts 的 THEME_IDS / 外观保持同步。
      (function() {
        var APPEARANCES = {
          default: 'light', pink: 'light',
          dark: 'dark', miku: 'dark',
        };
        var id = null;
        try {
          var stored = window.localStorage.getItem('vivy.theme');
          if (Object.prototype.hasOwnProperty.call(APPEARANCES, stored)) id = stored;
        } catch (e) { /* storage 不可用时使用默认主题 */ }
        if (!id) id = 'default';
        document.documentElement.setAttribute('data-theme', id);
        // .dark 类驱动 Tailwind dark: 变体；令牌值来自 [data-theme] 块
        document.documentElement.classList.toggle('dark', APPEARANCES[id] === 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
