<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>VIVY</title>
    <style>
      /* 预绘制只认外观（light/dark），不认识任何主题 id：两对中性近似值分别对应
         styles.css 的 --bg-app / --fg，用于 React 挂载前不闪底色。 */
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100dvh;
        max-height: 100dvh;
        overflow: hidden;
      }
      html, html body {
        background-color: #ebfaff;
        color: #1e3137;
      }
      html[data-appearance="dark"], html[data-appearance="dark"] body {
        background-color: #071519;
        color: #e9f4f8;
      }
    </style>
    <script>
      // React 挂载前应用持久化外观，避免深色皮肤先闪一帧浅色。
      // 家族 id 只在 hooks/use-theme.ts；这里只读 vivy.appearance。
      (function() {
        var appearance = 'light';
        try {
          if (window.localStorage.getItem('vivy.appearance') === 'dark') appearance = 'dark';
        } catch (e) { /* storage 不可用时按浅色预绘制 */ }
        document.documentElement.setAttribute('data-appearance', appearance);
        document.documentElement.classList.toggle('dark', appearance === 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
