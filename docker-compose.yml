# One Vivy organism. Do not `docker compose up --scale vivy=N`:
# one Journal, one process, replica=1.
# Do not publish 8787 on all host interfaces: /rpc/bootstrap has no user auth.
# Optional Postgres is a compose overlay: docker-compose.postgres.yml.

services:
  vivy:
    build:
      context: .
      # The sibling pinned Laputa checkout; `just docker-up` runs
      # `ensure-laputa` first. Same named context as scripts/docker-build.mjs.
      additional_contexts:
        laputa: ../laputa
      args:
        # The image build stage has no VCS client, so the container path is
        # proxy-only; the host-side defaults keep the `direct` fallback.
        GOPROXY: ${VIVY_GOPROXY:-https://goproxy.cn}
        NPM_REGISTRY: ${VIVY_NPM_REGISTRY:-https://registry.npmmirror.com}
    image: vivy:local
    container_name: vivy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - vivy-data:/data
    environment:
      TZ: Asia/Shanghai
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--tries=1", "http://127.0.0.1:8787/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  vivy-data:
