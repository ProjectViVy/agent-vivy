[package]
name = "vivy-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[features]
memory-tools = []
managed-skills = ["dep:rig-memory"]
protocol-types = ["dep:ts-rs"]

[dependencies]
rig-harness = { git = "https://github.com/0xPlaygrounds/rig", rev = "fc556f982d501eea9d7167398a19386e4884e776" }
bevy_ecs = { version = "=0.20.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vivy-process = { path = "../../crates/vivy-process" }
vivy-basics = { path = "../vivy-basics", default-features = false }
rig-memory = { git = "https://github.com/0xPlaygrounds/rig", rev = "fc556f982d501eea9d7167398a19386e4884e776", optional = true }
toml = "1.1"
toml_edit = { version = "0.25", features = ["serde"] }
ts-rs = { version = "=12.0.1", optional = true, features = ["no-serde-warnings"] }

[dev-dependencies]
tempfile = "3"
futures = "0.3"
