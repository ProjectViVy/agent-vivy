[package]
name = "vivy-diva-front"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[features]
persistent = ["vivy-durable/autodream", "dep:vivy-laputa"]

[dependencies]
rig-harness = { git = "https://github.com/0xPlaygrounds/rig", rev = "fc556f982d501eea9d7167398a19386e4884e776" }
rig-basics = { git = "https://github.com/0xPlaygrounds/rig", rev = "fc556f982d501eea9d7167398a19386e4884e776", default-features = false }
bevy_tasks = "=0.20.0"
bevy_ecs = { version = "=0.20.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings"] }
vivy-basics = { path = "../vivy-basics", default-features = false }
vivy-gateway = { path = "../vivy-gateway", default-features = false, features = ["protocol-types"] }
vivy-durable = { path = "../vivy-durable", features = ["runtime"] }
vivy-laputa = { path = "../vivy-laputa", optional = true }
vivy-python = { path = "../vivy-python", default-features = false, features = ["protocol-types", "managed-skills"] }
