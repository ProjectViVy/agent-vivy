apiVersion: vivy.generation/v1
profile: vivy-code
modules: [vivy/loop, vivy/model, vivy/tool-host, vivy/storage, vivy/checkpoint, vivy/credential, vivy/sandbox, vivy/protected-tools, vivy/mcp-host, vivy/status-host, vivy/action-host, vivy/face-host, vivy/tui, vivy/local-llm, vivy/lsp]
exclusive:
  std/face@v1: vivy/tui
grantApprovals:
  - {module: vivy/tui, name: rpc.client}
  - module: vivy/local-llm
    name: net.client
    constraints: {hosts: ["127.0.0.1", localhost, "::1"], schemes: [http], ports: ["8000", "8080", "11434", "1234"]}
  - {module: vivy/lsp, name: fs.read}
  - {module: vivy/lsp, name: fs.write}
  - module: vivy/lsp
    name: proc.spawn
    constraints: {commands: [gopls, typescript-language-server, pyright-langserver, rust-analyzer]}
