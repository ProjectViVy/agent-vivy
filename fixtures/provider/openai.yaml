# Vivy provider bundle: openai (OpenAI-compatible, direct provider).
# Conforms to schemas/providers.bundle.schema.json.
# Re-derived from the Diva providers catalog; NOT a verbatim copy (D-025).
# Contains shape + defaults only. The API key is read from the environment
# variable named by env_key at request time and is never persisted (D-010).

name: openai
api_type: openai
keywords:
  - openai
  - gpt
env_key: OPENAI_API_KEY
display_name: OpenAI
default_model: gpt-4o
gateway_prefix: ""
skip_prefixes: []
env_extras: []
is_gateway: false
is_local: false
detect_by_key_prefix: ""
detect_by_base_keyword: ""
default_api_base: https://api.openai.com/v1
strip_model_prefix: false
supports_prompt_caching: false
models:
  - gpt-4o
  - gpt-4o-mini
  - gpt-4-turbo
  - gpt-4
  - o1-preview
  - o1-mini
  - gpt-5.1
  - gpt-5
  - gpt-5-mini
  - gpt-5-nano
  - gpt-5-pro
  - gpt-5-chat
model_overrides: []
backend: eino-ext/openai

provenance:
  source: agent-diva/agent-diva-providers/src/providers.yaml
  entry: openai
  derived_at: "2026-08-07"
  note: >-
    Re-derived into the Vivy bundle schema with a backend field.
    default_model normalized from the gateway-prefixed form to plain gpt-4o.
    Dropped gpt-3.5-turbo (legacy) and gpt-image-1 (image-only model outside
    the V0 chat gateway scope). All other Diva chat models retained.
